# Causal Frontier Ratchet (CFR).

[package]
name        = "cfr_protocol"
description = "Leaderless causal-frontier group key agreement with ratcheted, codec-aware media protection"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme      = "../../README.md"
keywords    = ["e2ee", "conference", "webrtc", "cryptography", "cgka"]
categories  = ["cryptography", "multimedia"]

[dependencies]
cfr-core   = { workspace = true }
cfr-crypto = { workspace = true }
cfr-media  = { workspace = true }
thiserror     = { workspace = true }
fs2           = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }

[features]
default = ["std"]
std     = [
  "thiserror/std",
  "cfr-core/std",
  "cfr-core/persistence",
  "cfr-crypto/std",
  "cfr-crypto/persistence",
  "cfr-media/std",
  "cfr-media/persistence",
  "dep:fs2",
]
# Post-quantum profile: X25519 + ML-KEM-768 hybrid.
pq      = ["cfr-core/pq", "cfr-crypto/pq"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
