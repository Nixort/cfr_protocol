# Causal Frontier Ratchet (CFR).

name: CFR quality

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Stable quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run unit, integration, and documentation tests
        run: cargo test --workspace --all-features --locked
      - name: Build optimized artifacts
        run: cargo build --release --workspace --all-features --locked
      - name: Build public documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  msrv:
    name: MSRV 1.85 locked build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Enforce the locked MSRV dependency graph
        run: cargo check --workspace --all-features --locked
      - name: Enforce MSRV formatting and lint compatibility
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  package:
    name: Package readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Verify standalone cryptographic package contents
        run: cargo package --allow-dirty --locked --no-verify -p cfr-crypto

  release-validation:
    name: Tagged release validation
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, msrv, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Verify standalone package contents
        run: cargo package --allow-dirty --locked --no-verify -p cfr-crypto
