# Causal Frontier Ratchet (CFR).
# The workspace layout and validation discipline follow the engineering patterns
# established in the VLT, HRCC, and Fjord repositories.

[workspace]
resolver = "2"
members = [
  "crates/cfr-crypto",
  "crates/cfr-core",
  "crates/cfr-media",
  "crates/cfr",
]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["Nixort"]
repository = "https://github.com/Nixort/cfr_protocol"
description = "Leaderless causal-frontier group key agreement with ratcheted, codec-aware media protection"

[workspace.dependencies]
cfr-crypto = { path = "crates/cfr-crypto", version = "1.0.0-rc.1", default-features = false }
cfr-core = { path = "crates/cfr-core", version = "1.0.0-rc.1", default-features = false }
cfr-media = { path = "crates/cfr-media", version = "1.0.0-rc.1", default-features = false }

aegis = { version = "0.9", default-features = false }
blake3 = { version = "1.8", default-features = false }
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize", "fast", "alloc"] }
ml-kem = { version = "0.3", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.9", default-features = false, features = ["derive"] }
subtle = { version = "2.6", default-features = false }
rand_core = { version = "0.10", default-features = false }
getrandom = { version = "0.4", default-features = false }
thiserror = { version = "2.0", default-features = false }
arbitrary = { version = "1.4", features = ["derive"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

[profile.bench]
inherits = "release"
debug = true
